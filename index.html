<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h2 id="question"></h2>
    <div class="answers-container">
      <button onclick="showResult('answer-0')" id="answer-0"></button>
      <button onclick="showResult('answer-1')" id="answer-1"></button>
      <button onclick="showResult('answer-2')" id="answer-2"></button>
      <button onclick="showResult('answer-3')" id="answer-3"></button>
    </div>
    <div class="buttons-container">
      <button onclick="showAllResults()">Lösung</button>
      <button onclick="nextQuestion()">Weiter</button>
    </div>
  </body>
  <script src="index.js"></script>
</html>
